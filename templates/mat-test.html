<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#071f37">
    <title>Pressure mat test</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  </head>
  <body>
    <main class="app-shell">
      <div id="connection-banner" class="connection-banner" hidden>
        The kiosk server is unavailable. Reconnecting…
      </div>

      <section class="screen setup-screen">
        <div class="setup-card mat-test-card">
          <p class="eyebrow">Testing tool</p>
          <h1>Pressure mat counter</h1>
          <p class="setup-copy">Press and fully release the mat each time. Every new press will increase the counter.</p>

          <div id="mat-indicator" class="mat-indicator" aria-live="polite">
            <span class="mat-indicator__light" aria-hidden="true"></span>
            <span id="mat-indicator-text">Checking pressure mat…</span>
          </div>

          <div class="press-counter" aria-live="polite">
            <span>Presses</span>
            <strong id="press-count">0</strong>
          </div>

          <div class="mat-test-actions">
            <button id="reset-count" class="mat-test-button" type="button">Reset counter</button>
            <a class="mat-test-button mat-test-button--secondary" href="{{ url_for('index') }}">Back to setup</a>
          </div>

          <p id="mode-label" class="mode-label">Checking input…</p>
        </div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/mat-test.js') }}" defer></script>
  </body>
</html>
